name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contract-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api-spec/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./api-spec
      - name: Check generated OpenAPI is up to date
        run: |
          npm run compile
          git diff --exit-code -- api-spec/openapi.yaml
        working-directory: ./api-spec

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Generate API models
        run: make generate-backend
        working-directory: .
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  playwright-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: uv sync --dev
        working-directory: ./backend
      - name: Generate backend models
        run: make generate-backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./frontend
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./frontend
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
