components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `meeting_type_not_found`.
        message:
          type: string
          description: Human-readable message.
      description: Machine-readable domain error.
    Availability:
      type: object
      required:
        - id
        - name
        - timezone
        - weekly
        - overrides
        - meeting_types_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
          description: Unique (case-insensitive) within the Host.
        timezone:
          type: string
          description: IANA timezone the weekly windows and overrides are interpreted in.
        weekly:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AvailabilityWindow'
          description: 'Weekly windows keyed by ISO weekday: 1 = Monday … 7 = Sunday. An empty array means a day off.'
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/DateOverride'
        meeting_types_count:
          type: integer
          format: int32
          description: How many Meeting Types reference this Availability, including archived ones.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: Named, Host-scoped schedule of recurring weekly windows plus date overrides.
    AvailabilityListResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Availability'
        total:
          type: integer
          format: int32
    AvailabilityWindow:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):(00|05|10|15|20|25|30|35|40|45|50|55)$
          description: Local start time, `HH:MM` on a 5-minute grid.
        end:
          type: string
          pattern: ^(([01][0-9]|2[0-3]):(00|05|10|15|20|25|30|35|40|45|50|55)|24:00)$
          description: Local end time, `HH:MM` on a 5-minute grid, or `24:00` for local midnight.
      description: A local-time interval on one weekday. Times use a 5-minute grid; `24:00` is allowed only as an end.
    AvailabilityWrite:
      type: object
      required:
        - name
        - timezone
        - weekly
        - overrides
      properties:
        name:
          type: string
          description: 1–100 characters after trim, unique within the Host case-insensitively.
        timezone:
          type: string
          description: IANA timezone the weekly windows and overrides are interpreted in.
        weekly:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AvailabilityWindow'
          description: 'Weekly windows keyed by ISO weekday: 1 = Monday … 7 = Sunday. An empty array means a day off.'
