openapi: 3.1.0
info:
  title: Booking API
  version: 0.0.0
tags:
  - name: Auth
  - name: Availabilities
  - name: Meeting Types
  - name: Booking Page
  - name: Guest Bookings
  - name: Host Bookings
paths:
  /auth/login:
    post:
      operationId: Auth_login
      description: Authenticate the Host and set the `host_session` httpOnly cookie.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: Auth_logout
      description: Clear the `host_session` cookie.
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Auth
  /auth/me:
    get:
      operationId: Auth_me
      description: Return the currently authenticated Host.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - Auth
      security:
        - ApiKeyAuth: []
  /book/{slug}:
    get:
      operationId: BookingPage_getMeetingType
      description: Meeting Type data for the public Booking Page.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '410':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoneError'
      tags:
        - Booking Page
  /book/{slug}/bookings:
    post:
      operationId: BookingPage_createBooking
      description: Create a pending Booking. A repeated Idempotency-Key returns the current state with 200 instead of creating a second Booking.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreated'
        '201':
          description: HTTP 201 response for a newly created Booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreated'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '410':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoneError'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      tags:
        - Booking Page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
  /book/{slug}/slots:
