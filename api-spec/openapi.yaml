  /hosts/me/meeting-types:
    get:
      operationId: HostMeetingTypes_list
      description: List Host-scoped Meeting Types, newest first.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
