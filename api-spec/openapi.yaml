      operationId: BookingPage_listSlots
      description: Available Slots for a Meeting Type over a date range, grouped in the display timezone.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
        - name: timezone
          in: query
          required: true
          schema:
            type: string
          explode: false
