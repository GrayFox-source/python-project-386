[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.5",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "ruff>=0.17.0",
]



[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["generated"]

[tool.ruff.lint]
select = ["E", "F", "I"]
